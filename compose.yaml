services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: costudy
      POSTGRES_USER: costudy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costudy -d costudy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://costudy:${POSTGRES_PASSWORD}@db:5432/costudy
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/tanya/co-study-certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  postgres_data:
